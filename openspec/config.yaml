schema: spec-driven

context: |
  Проєкт: Повір у себе — Меню кейтерингу (appsucu/menu_povir_u_sebe).
  Призначення: інтерактивний вебкалендар та каталог страв кейтерингу для простору «Повір у себе» (Київ, вул. Почайнинська 38/44).
  Технічний стек: семантичний HTML5, CSS Grid / Subgrid, чистий Vanilla JavaScript (ES6+), JSON-LD (Schema.org), Python 3 для локального сервера, GitHub Actions + Pages.
  Архітектурні обмеження: публікований сайт знаходиться виключно у директорії dist/. Жодних npm-залежностей, збірок чи важких JS-фреймворків. Тексти та інтерфейс — українською мовою.

rules:
  proposal:
    - "Завжди вказувати чи вимагає зміна оновлення dist/menu.json та Schema.org JSON-LD в dist/index.html"
    - "Обов'язково описувати вплив на адаптивну верстку (mobile/desktop) та a11y (accessibility)"
  specs:
    - "Використовувати чіткі формулювання вимог (SHALL, MUST)"
    - "Сценарії обов'язково структурувати через WHEN / THEN або GIVEN / WHEN / THEN"
    - "Опис кожної вимоги формулювати стисло (до 500 символів)"
  tasks:
    - "Включати синтаксичну валідацію: python3 -m json.tool dist/menu.json та node --check dist/menu.js"
    - "Перевіряти коректність роботи фільтрації, підсвічування тексту та експорту в PDF"
    - "Валідувати зміни через openspec validate --specs"

operations:
  apply:
    guidance:
      - "Перевіряти адаптивну верстку на ширинах мобільних пристроїв та десктопу"
      - "Зберігати узгодженість між dist/index.html та dist/menu.json"
  archive:
    guidance:
      - "Підсумовувати оновлені вимоги та стан синхронізації з dist/"
